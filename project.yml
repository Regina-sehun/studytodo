name: StudyTodo
options:
  bundleIdPrefix: com.regina0317
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StudyTodo:
    type: application
    platform: iOS
    sources:
      - StudyTodo
      - Shared
    dependencies:
      - target: StudyTodoWidgetExt
        embed: true
    entitlements:
      path: StudyTodo/StudyTodo.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.regina0317.studytodo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: StudyTodo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"

  StudyTodoWidgetExt:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    entitlements:
      path: Widget/Widget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: StudyTodo 小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.regina0317.studytodo.widget
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  StudyTodo:
    build:
      targets:
        StudyTodo: all
    run:
      config: Debug
    archive:
      config: Release
