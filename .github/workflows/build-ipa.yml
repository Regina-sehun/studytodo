name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 查看可用 Xcode
        run: ls /Applications | grep -i xcode || true

      - name: 选择最新 Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "没有找到 Xcode"; exit 1; fi
          echo "使用 $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild -project StudyTodo.xcodeproj \
            -scheme StudyTodo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 用 ad-hoc 签名写入权限（App Group）
        run: |
          APP="build/Build/Products/Release-iphoneos/StudyTodo.app"
          codesign --force --sign - --entitlements Widget/Widget.entitlements "$APP/PlugIns/StudyTodoWidgetExt.appex"
          codesign --force --sign - --entitlements StudyTodo/StudyTodo.entitlements "$APP"
          codesign -dv "$APP" 2>&1 | head -20 || true

      - name: 打包 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/StudyTodo.app"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr StudyTodo.ipa Payload

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: StudyTodo-ipa
          path: StudyTodo.ipa
          if-no-files-found: error
